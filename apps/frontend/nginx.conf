# nginx config for the built SPA.
#
# The app uses createBrowserRouter (history-API routing), so any deep link like
# /patient/records is a real path the browser asks the server for. Without the
# try_files fallback below, a refresh or a shared URL 404s — nginx would look for
# a file at that path and find nothing. Falling back to index.html hands the
# route to React, which is the whole point of client-side routing.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames (Vite emits e.g. index-a1b2c3.js) can be cached
  # forever — a change produces a new filename, so a stale cache is impossible.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NOT be cached, or a client keeps loading a document that
  # references deleted asset hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # gzip is on by default in the official image for text types; no need to
  # restate it. Distinguishing 404s is not worth the config in a demo.
}
