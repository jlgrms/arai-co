# fly.toml app configuration file generated for telehealth-backend-dry-mountain-2145 on 2026-09-23T09:12:40+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# ============================================================================
# !! BUILD CONTEXT IS THE REPO ROOT, NOT apps/backend !!
# ============================================================================
# This is a monorepo: the Dockerfile copies pnpm-workspace.yaml, the root
# lockfile, and apps/frontend/package.json, because a pnpm workspace install
# needs every member manifest present. Deploy from the repo root:
#
#   fly deploy -c apps/backend/fly.toml
#
# Fly has NO fly.toml field for the build context — `[build] dockerfile` only
# sets the Dockerfile path, and its docs explicitly note that it "will not
# change the Docker context path, which is set to the project root directory by
# default". The context is whatever directory `fly deploy` is invoked from.
# So this warning can only live as a comment, and it cannot be enforced by the
# config. If `fly launch` ever regenerates this file, RE-ADD THIS COMMENT —
# without it, running `fly deploy` from apps/backend/ fails on the Dockerfile's
# COPY of the root package.json ("file not found in build context").
#
# Secrets to set before the first deploy (never committed):
#   fly secrets set DATABASE_URL=... JWT_SECRET=... FRONTEND_URL=https://<frontend>.fly.dev
#   fly secrets set DEEPSEEK_API_KEY=...   # optional; AI matching degrades gracefully
# ============================================================================
#

app = 'telehealth-backend-dry-mountain-2145'
primary_region = 'sin'

[build]
  # Path is relative to the build context, which is the repo root (see the
  # banner above). It must include the apps/backend/ prefix: a bare
  # 'Dockerfile' would resolve to <repo-root>/Dockerfile, which does not exist.
  dockerfile = 'apps/backend/Dockerfile'

[deploy]
  # Run Prisma via the CLI already baked into the image's node_modules. Do NOT
  # use `pnpm --filter ...` here: in the release container that has no workspace
  # manifest it triggers a full dependency REINSTALL at runtime, which makes
  # Corepack pull a fresh pnpm major (12.x) and abort with
  # ERR_PNPM_IGNORED_BUILDS. `npx --no-install` never resolves or downloads
  # anything — it only executes the local binary.
  release_command = 'npx --no-install prisma migrate deploy'

[env]
  BACKEND_PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
