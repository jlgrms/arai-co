# fly.toml app configuration file generated for telehealth-backend-dry-mountain-2145 on 2026-09-23T09:12:40+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telehealth-backend-dry-mountain-2145'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Run Prisma via the CLI already baked into the image's node_modules. Do NOT
  # use `pnpm --filter ...` here: in the release container that has no workspace
  # manifest it triggers a full dependency REINSTALL at runtime, which makes
  # Corepack pull a fresh pnpm major (12.x) and abort with
  # ERR_PNPM_IGNORED_BUILDS. `npx --no-install` never resolves or downloads
  # anything — it only executes the local binary.
  release_command = 'npx --no-install prisma migrate deploy'

[env]
  BACKEND_PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
